<!DOCTYPE html>
<html lang="en">


<head>

    <!-- Defines the character encoding for the webpage -->
    <meta charset="UTF-8">


    <!-- Sets the browser tab title -->
    <title>
        Forgot Password | Urban Coders Guild
    </title>


    <!-- Sets the website favicon -->
    <link rel="icon" type="image/webp" href="/static/images/ucg_logo.webp">


    <!-- Imports the Poppins font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- Links the main CSS stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">

</head>



<body>



<!-- Top navigation bar -->
{% from "components/navbar.html" import navbar with context %}
{{ navbar(show_links=false) }}






<!-- Main authentication page container -->
<div class="auth-container single-auth">





    <!-- Forgot password form card -->
    <div class="card auth-card">



        <!-- Form heading -->
        <h2>
            Reset Password
        </h2>



        <!-- Instructions for the user -->
        <p style="text-align:center; margin-bottom:30px;">

            Enter the email associated with your account.
            We will send you a secure password reset link.

        </p>





        <!-- Displays a message or error returned from Flask -->
        {% if message %}

        <div class="error">

            {{ message }}

        </div>

        {% endif %}




        <!-- Form that sends the email reset request to Flask -->
        <form action="/forgot-password" method="POST">


            <!-- Email input label -->
            <label>
                Email Address
            </label>


            <!-- Input field for user's account email -->
            <input
                class="input"
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >



            <!-- Button to submit password reset request -->
            <button type="submit">

                Send Reset Email

            </button>



        </form>





        <!-- Link for users who remember their password -->
        <p style="text-align:center; margin-top:25px;">


            Remember your password?


            <a href="/login">
                Login
            </a>


        </p>



    </div>




</div>




</body>


</html>
