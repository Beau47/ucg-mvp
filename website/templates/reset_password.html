<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<title>
Reset Password | Urban Coders Guild
</title>

<link rel="icon" type="image/webp" href="/static/images/ucg_logo.webp">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/style.css">

</head>




<body>



{% from "components/navbar.html" import navbar with context %}
{{ navbar(show_links=false) }}





<div class="auth-container single-auth">



    <div class="card auth-card">



        <h2>
            Reset Password
        </h2>



        <p style="text-align:center; margin-bottom:30px;">

            Enter your new password below.

        </p>




        <form id="reset-form">



            <label>
                New Password
            </label>


            <input
                class="input"
                type="password"
                id="password"
                placeholder="Create a new password"
                required
            >




            <label>
                Confirm Password
            </label>


            <input
                class="input"
                type="password"
                id="confirm-password"
                placeholder="Confirm your new password"
                required
            >




            <button
                type="submit"
                class="auth-button"
            >
                Change Password
            </button>



        </form>



    </div>



</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// Creates Supabase client using public anon key
const supabaseClient = supabase.createClient(

    "https://uvyxxblgnjcjcgscgiib.supabase.co",

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2eXh4YmxnbmpjamNnc2NnaWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjAyMzgsImV4cCI6MjA5OTUzNjIzOH0.199-ZncdU8wQsUj6JZjaueFXXJ0PCXwDBL--0vK_MUU"

);





// Checks whether the user arrived from a valid Supabase reset email
async function setupRecoverySession(){



    const hash =
    window.location.hash.substring(1);



    const params =
    new URLSearchParams(hash);



    const access_token =
    params.get("access_token");



    const refresh_token =
    params.get("refresh_token");




    // No recovery token means user manually visited the page
    if (!access_token || !refresh_token) {


        alert(
            "You do not have permission to access this page. Please request a password reset link."
        );


        window.location.replace("/login");


        return false;

    }




    // Creates temporary password reset session
    const {error} =
    await supabaseClient.auth.setSession({

        access_token: access_token,

        refresh_token: refresh_token

    });





    // Invalid or expired reset link
    if(error){


        alert(
            "This password reset link has expired or is invalid."
        );


        window.location.replace("/login");


        return false;

    }



    return true;


}






// Only enable password form after valid recovery session
setupRecoverySession()
.then(valid => {


    if(!valid){

        document
        .getElementById("reset-form")
        .style.display = "none";

    }


});









document
.getElementById("reset-form")
.addEventListener(
"submit",
async(event)=>{


event.preventDefault();




const password =
document.getElementById("password").value;



const confirmPassword =
document.getElementById("confirm-password").value;





if(password !== confirmPassword){


    alert(
        "Passwords do not match."
    );


    return;


}






const {error} =
await supabaseClient.auth.updateUser({

    password: password

});






if(error){


    alert(error.message);


}

else{


    alert(
        "Password updated successfully!"
    );



    // Removes temporary recovery session
    await supabaseClient.auth.signOut();




    // Sends user back to login
    window.location.replace("/login");


}



});


</script>




</body>

</html>
