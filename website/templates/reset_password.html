<!DOCTYPE html>
<html lang="en">


<head>

<!-- Defines the character encoding for the webpage -->
<meta charset="UTF-8">


<!-- Sets the browser tab title -->
<title>
Reset Password | Urban Coders Guild
</title>


<!-- Sets the website favicon -->
<link rel="icon" type="image/webp" href="/static/images/ucg_logo.webp">


<!-- Imports the Poppins font from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<!-- Links the main CSS stylesheet -->
<link rel="stylesheet" href="/static/css/style.css">


</head>




<body>


<!-- Top navigation bar -->
<header class="topbar">


<!-- Website logo/name -->
<div class="logo">

Urban Coders Guild

</div>


</header>






<!-- Main authentication container -->
<div class="auth-container">



<!-- Left section containing page information -->
<div class="auth-info">


<!-- Main heading -->
<h1>
Create a New Password
</h1>



<!-- Explanation of password reset -->
<p>

Choose a new secure password for your Urban Coders Guild account.

</p>


<!-- Feature highlights -->
<div class="feature">
🔒 Secure Account Protection
</div>


<div class="feature">
🐍 Continue Learning Python
</div>


<div class="feature">
🚀 Return to Your Dashboard
</div>


</div>








<!-- Password reset form card -->
<div class="card auth-card">


<!-- Form heading -->
<h2>
New Password
</h2>



<!-- Instructions for entering a new password -->
<p style="text-align:center; margin-bottom:30px;">

Enter your new password below.

</p>




<!-- Form that handles password reset -->
<form id="reset-form">



<!-- Password input label -->
<label>
New Password
</label>



<!-- Input field for new password -->
<input
class="input"
type="password"
id="password"
placeholder="Create a new password"
required
>




<!-- Button to submit password change -->
<button type="submit">

Change Password

</button>



</form>




</div>





</div>








<!-- Loads the Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// Creates a Supabase client using the project URL and anon key
const supabaseClient = supabase.createClient(

    "https://uvyxxblgnjcjcgscgiib.supabase.co",

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2eXh4YmxnbmpjamNnc2NnaWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjAyMzgsImV4cCI6MjA5OTUzNjIzOH0.199-ZncdU8wQsUj6JZjaueFXXJ0PCXwDBL--0vK_MUU"

);



// Adds an event listener to handle password reset form submission
document
.getElementById("reset-form")
.addEventListener(
"submit",
async(event)=>{


// Prevents the browser from refreshing the page after submission
event.preventDefault();



// Gets the password entered by the user
const password =
document.getElementById("password").value;




// Sends the new password to Supabase Auth
const {error} =
await supabaseClient.auth.updateUser({

    password: password

});



// Checks if Supabase returned an error
if (error) {
    alert(error.message);
} else {
    alert("Password updated successfully!");

    // Sign out the temporary recovery session
    await supabaseClient.auth.signOut();

    // Redirect to login
    window.location.replace("/login");
}



});


</script>




</body>


</html>
